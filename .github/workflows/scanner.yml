name: Institutional Scanner Workflow

on:
  workflow_dispatch:

  schedule:
    # Before market opens (08:45 IST)
    - cron: "15 3 * * 1-5"

    # After market closes (15:45 IST)
    - cron: "15 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: institutional-scanner
  cancel-in-progress: false

jobs:
  scanner:
    name: Institutional Market Scanner

    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"

    steps:

      # ==================================================
      # Checkout Repository
      # ==================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ==================================================
      # Setup Python
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==================================================
      # Cache pip
      # ==================================================

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ==================================================
      # Install Dependencies
      # ==================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==================================================
      # Prepare Report Directories
      # ==================================================

      - name: Prepare Report Directories
        run: |
          echo "Preparing report directories..."

          mkdir -p scanner_monitor/reports
          mkdir -p scanner_monitor/reports/latest
          mkdir -p scanner_monitor/reports/history

          touch scanner_monitor/reports/latest/.gitkeep
          touch scanner_monitor/reports/history/.gitkeep

          echo
          echo "Directory Structure"
          find scanner_monitor/reports -maxdepth 2 -type d

      # ==================================================
      # Execute Scanner
      # ==================================================

      - name: Execute Scanner Workflow
        run: |
          python -m scanner_monitor.run_workflow

      # ==================================================
      # Display Generated Reports
      # ==================================================

      - name: Display Generated Reports
        if: always()
        run: |
          mkdir -p scanner_monitor/reports/latest
          mkdir -p scanner_monitor/reports/history

          echo
          echo "=============================="
          echo "LATEST REPORTS"
          echo "=============================="
          ls -lah scanner_monitor/reports/latest || true

          echo
          echo "=============================="
          echo "HISTORY REPORTS"
          echo "=============================="
          ls -lah scanner_monitor/reports/history || true

      # ==================================================
      # Git Status
      # ==================================================

      - name: Git Status
        if: always()
        run: |
          echo
          echo "=============================="
          echo "GIT STATUS"
          echo "=============================="

          git status

          echo
          echo "Modified Files"

          git diff --name-only || true

      # ==================================================
      # Commit Updated Reports
      # ==================================================

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p scanner_monitor/reports
          mkdir -p scanner_monitor/reports/latest
          mkdir -p scanner_monitor/reports/history

          touch scanner_monitor/reports/latest/.gitkeep
          touch scanner_monitor/reports/history/.gitkeep

          git add -A

          if git diff --cached --quiet; then
            echo "No report changes detected."
            exit 0
          fi

          git commit -m "Auto update scanner reports ($(date -u '+%Y-%m-%d %H:%M UTC'))"

      # ==================================================
      # Pull & Push Changes
      # ==================================================

      - name: Push Changes
        run: |
          set -e

          mkdir -p scanner_monitor/reports
          mkdir -p scanner_monitor/reports/latest
          mkdir -p scanner_monitor/reports/history

          touch scanner_monitor/reports/latest/.gitkeep
          touch scanner_monitor/reports/history/.gitkeep

          for i in 1 2 3; do

            echo
            echo "=============================="
            echo "Push Attempt $i"
            echo "=============================="

            git fetch origin

            if ! git pull --rebase origin "${{ github.ref_name }}"; then

              echo
              echo "Rebase conflict detected."

              git rebase --abort || true

              mkdir -p scanner_monitor/reports/latest
              mkdir -p scanner_monitor/reports/history

              touch scanner_monitor/reports/latest/.gitkeep
              touch scanner_monitor/reports/history/.gitkeep

              git add -A

              if ! git diff --cached --quiet; then
                git commit --amend --no-edit || true
              fi

            fi

            if git push origin HEAD:${{ github.ref_name }}; then
              echo
              echo "Push successful."
              exit 0
            fi

            echo
            echo "Push failed. Retrying in 5 seconds..."
            sleep 5

          done

          echo
          echo "Failed to push after 3 attempts."
          exit 1

      # ==================================================
      # Upload Reports
      # ==================================================

      - name: Upload Scanner Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-results
          path: scanner_monitor/reports
          retention-days: 30
