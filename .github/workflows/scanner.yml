name: Institutional Scanner Workflow

on:
  # --------------------------------------------------
  # Manual execution
  # --------------------------------------------------
  workflow_dispatch:

  # --------------------------------------------------
  # Scheduled execution
  # --------------------------------------------------
  schedule:
    - cron: "55 * * * 1-5"
# --------------------------------------------------
# Required to allow pushing commits back to repository
# --------------------------------------------------
permissions:
  contents: write

jobs:
  scanner:
    name: Run Market Scanner
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout Repository
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # --------------------------------------------------
      # Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # Cache pip packages
      # --------------------------------------------------
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # --------------------------------------------------
      # Install Dependencies
      # --------------------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # Execute Scanner
      # --------------------------------------------------
      - name: Execute Scanner Workflow
        run: |
          python -m scanner_monitor.run_workflow

      # --------------------------------------------------
      # Show Git Status (Debug)
      # --------------------------------------------------
      - name: Git Status
        run: |
          echo "Repository Status:"
          git status
          echo
          echo "Modified Files:"
          git diff --name-only || true

      # --------------------------------------------------
      # Commit Updated Files
      # --------------------------------------------------
      - name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Auto update scanner reports"

      # --------------------------------------------------
      # Push Changes
      # --------------------------------------------------
      - name: Push Changes
        run: |
          git push origin HEAD:${{ github.ref_name }}

      # --------------------------------------------------
      # Upload Reports
      # --------------------------------------------------
      - name: Upload Scanner Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-results
          path: scanner_monitor/reports/
          retention-days: 30
